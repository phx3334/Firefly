<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-label="PG failover 流程：先确认旧主真死再提升从库，Service 切向新主应用无感，旧主回归须清空重建；异步复制留下秒级丢失窗口，脑裂靠先隔离旧主来避免">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#98a2b3"/></marker>
    <marker id="ahO" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff7a45"/></marker>
  </defs>
  <rect width="800" height="560" fill="#ffffff"/>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="400" y="32" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#222">PG failover 流程：难的从来不是提升从库，是裁决</text>

    <!-- 步骤 1 -->
    <rect x="30" y="56" width="430" height="56" rx="8" fill="#fbfcfe" stroke="#4a6fa5" stroke-width="1.6"/>
    <text x="44" y="78" font-size="13" font-weight="bold" fill="#1d4e89">① 主库失联 → 先确认真死</text>
    <text x="44" y="98" font-size="11.5" fill="#5a6478">网络分区 ≠ 宕机：误切比慢切更危险</text>
    <path d="M245,112 L245,130" fill="none" stroke="#ff7a45" stroke-width="2" marker-end="url(#ahO)"/>

    <!-- 步骤 2 -->
    <rect x="30" y="130" width="430" height="56" rx="8" fill="#fbfcfe" stroke="#4a6fa5" stroke-width="1.6"/>
    <text x="44" y="152" font-size="13" font-weight="bold" fill="#1d4e89">② 提升从库（promote）</text>
    <text x="44" y="172" font-size="11.5" fill="#5a6478">时间线 +1，与旧主的 WAL 流就此作废</text>
    <path d="M245,186 L245,204" fill="none" stroke="#ff7a45" stroke-width="2" marker-end="url(#ahO)"/>

    <!-- 步骤 3 -->
    <rect x="30" y="204" width="430" height="56" rx="8" fill="#fbfcfe" stroke="#4a6fa5" stroke-width="1.6"/>
    <text x="44" y="226" font-size="13" font-weight="bold" fill="#1d4e89">③ Service 切向新主</text>
    <text x="44" y="246" font-size="11.5" fill="#5a6478">改指向秒级生效，应用配置不变</text>
    <path d="M245,260 L245,278" fill="none" stroke="#ff7a45" stroke-width="2" marker-end="url(#ahO)"/>

    <!-- 步骤 4 -->
    <rect x="30" y="278" width="430" height="56" rx="8" fill="#fbfcfe" stroke="#4a6fa5" stroke-width="1.6"/>
    <text x="44" y="300" font-size="13" font-weight="bold" fill="#1d4e89">④ 应用重连</text>
    <text x="44" y="320" font-size="11.5" fill="#5a6478">连接池自动重建连接，恢复写入</text>
    <path d="M245,334 L245,352" fill="none" stroke="#ff7a45" stroke-width="2" marker-end="url(#ahO)"/>

    <!-- 步骤 5 -->
    <rect x="30" y="352" width="430" height="56" rx="8" fill="#fbfcfe" stroke="#4a6fa5" stroke-width="1.6"/>
    <text x="44" y="374" font-size="13" font-weight="bold" fill="#1d4e89">⑤ 旧主回归 → 清空重建</text>
    <text x="44" y="394" font-size="11.5" fill="#5a6478">时间线已分叉：重新全量拉取，以从库身份归队</text>

    <!-- 右上：异步复制的代价 -->
    <rect x="480" y="56" width="290" height="250" rx="8" fill="#f7f9fc" stroke="#d8dee8"/>
    <text x="494" y="80" font-size="12.5" font-weight="bold" fill="#1d4e89">异步复制的代价：为什么有丢失窗口</text>
    <text x="494" y="104" font-size="11.5" fill="#333">主库提交即返回客户端，</text>
    <text x="494" y="123" font-size="11.5" fill="#333">不等从库收到（异步复制）</text>
    <text x="494" y="142" font-size="11.5" fill="#333">主库宕机瞬间，未传到从库的</text>
    <text x="494" y="161" font-size="11.5" fill="#333">WAL 直接丢失——这就是</text>
    <text x="494" y="180" font-size="11.5" font-weight="bold" fill="#b3541e">秒级 RPO（丢多少数据）的来源</text>
    <text x="494" y="206" font-size="11.5" fill="#333">压到零：改用同步复制，</text>
    <text x="494" y="225" font-size="11.5" fill="#333">从库落盘才确认提交，</text>
    <text x="494" y="244" font-size="11.5" fill="#333">代价是失联时写入阻塞</text>

    <!-- 右下：RTO -->
    <rect x="480" y="326" width="290" height="84" rx="8" fill="#f7f9fc" stroke="#d8dee8"/>
    <text x="494" y="348" font-size="12.5" font-weight="bold" fill="#1d4e89">切换时间（RTO）</text>
    <text x="494" y="368" font-size="11.5" fill="#333">检测 + 裁决 + 提升 + 重连：人工</text>
    <text x="494" y="386" font-size="11.5" fill="#333">十分钟起步，Operator 秒级自动</text>

    <!-- 底部：脑裂 -->
    <rect x="30" y="436" width="740" height="92" rx="8" fill="#f7f9fc" stroke="#d8dee8"/>
    <text x="44" y="458" font-size="12.5" font-weight="bold" fill="#b3541e">脑裂（split-brain）</text>
    <text x="44" y="478" font-size="11.5" fill="#333">旧主其实没死只是分区，promote 后两边同时接受写入 → 数据永久分叉且无解。</text>
    <text x="44" y="500" font-size="11.5" fill="#333">守则：先隔离旧主（关机、断网）再提升新主；Operator（CNPG 拿 K8s API 当仲裁）先 fencing 再 promote。</text>
  </g>
</svg>
