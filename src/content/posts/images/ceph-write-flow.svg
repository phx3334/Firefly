<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="一次三副本写入的网络路径：客户端经公共网络把写请求发给主 OSD，主 OSD 经集群网络把数据复制给两个副本 OSD，全部落盘后向客户端返回确认">
  <style>
    .t { fill: #171717; font: 500 14px/20px -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; text-anchor: middle; }
    .ts { fill: #52525B; font: 400 12px/18px -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; text-anchor: middle; }
    .tsl { fill: #52525B; font: 400 12px/18px -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; text-anchor: start; }
    .flow { stroke: #0FDC78; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .flow-a { stroke: #0D9488; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .read { stroke: #52525B; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 4 4; fill: none; }
    .node-neutral { fill: #FFFFFF; stroke: rgba(23, 23, 23, 0.16); }
    .node-external { fill: #EFEFF2; stroke: rgba(23, 23, 23, 0.16); }
  </style>

  <defs>
    <marker id="arrB" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#0FDC78"/>
    </marker>
    <marker id="arrA" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#0D9488"/>
    </marker>
    <marker id="arrM" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#52525B"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="760" height="380" rx="16" fill="#F7F7F8"/>

  <!-- 客户端 -->
  <rect x="40" y="134" width="140" height="72" rx="26" class="node-external"/>
  <text x="110" y="164" class="t">客户端</text>
  <text x="110" y="186" class="ts">librados</text>

  <!-- 主 OSD -->
  <rect x="290" y="134" width="140" height="72" rx="8" class="node-neutral"/>
  <text x="360" y="164" class="t">主 OSD</text>
  <text x="360" y="186" class="ts">PG 主副本</text>

  <!-- 副本 OSD（上下两个） -->
  <rect x="550" y="24" width="140" height="72" rx="8" class="node-neutral"/>
  <text x="620" y="54" class="t">副本 OSD</text>
  <text x="620" y="76" class="ts">PG 副本</text>

  <rect x="550" y="244" width="140" height="72" rx="8" class="node-neutral"/>
  <text x="620" y="274" class="t">副本 OSD</text>
  <text x="620" y="296" class="ts">PG 副本</text>

  <!-- 客户端 → 主 OSD（公共网络） -->
  <text x="232" y="144" class="ts">写请求</text>
  <path d="M180 158 L284 158" class="flow" marker-end="url(#arrB)"/>
  <path d="M284 182 L186 182" class="read" marker-end="url(#arrM)"/>
  <text x="232" y="204" class="ts">确认</text>

  <!-- 主 OSD → 副本 OSD（集群网络） -->
  <text x="487" y="96" class="ts">复制</text>
  <path d="M430 152 L544 80" class="flow-a" marker-end="url(#arrA)"/>
  <path d="M430 188 L544 260" class="flow-a" marker-end="url(#arrA)"/>
  <text x="487" y="246" class="ts">复制</text>

  <!-- 图例 -->
  <rect x="40" y="344" width="18" height="4" rx="2" fill="#0FDC78"/>
  <text x="64" y="352" class="tsl">public_network · 客户端流量</text>
  <rect x="290" y="344" width="18" height="4" rx="2" fill="#0D9488"/>
  <text x="314" y="352" class="tsl">cluster_network · OSD 间流量</text>
  <path d="M560 346 L578 346" class="read"/>
  <text x="586" y="352" class="tsl">确认返回</text>
</svg>
