<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-label="Operator 控制循环：Watch CRD 变更，对比 Spec 与实际状态差异，执行操作并回写 Status">
  <style>
    .t { fill: #171717; font: 500 14px/20px -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; text-anchor: middle; }
    .ts { fill: #52525B; font: 400 12px/18px -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; text-anchor: middle; }
    .tsl { fill: #52525B; font: 400 12px/18px -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; text-anchor: start; }
    .flow { stroke: #0FDC78; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .read { stroke: #52525B; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 4 4; fill: none; }
    .boundary { fill: none; stroke: rgba(23, 23, 23, 0.12); stroke-dasharray: 6 6; }
    .node-neutral { fill: #FFFFFF; stroke: rgba(23, 23, 23, 0.16); }
    .node-external { fill: #EFEFF2; stroke: rgba(23, 23, 23, 0.16); }
    .node-brand { fill: #E5FFF2; stroke: #0FDC78; }
    .capsule { fill: #FFFFFF; stroke: rgba(23, 23, 23, 0.16); }
  </style>
  <defs>
    <marker id="arrB" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#0FDC78"/>
    </marker>
    <marker id="arrM" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#52525B"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="430" rx="16" fill="#F7F7F8"/>

  <!-- 用户 / kubectl -->
  <rect x="50" y="50" width="200" height="56" rx="10" class="node-external"/>
  <text x="150" y="73" class="t">用户 / kubectl</text>
  <text x="150" y="93" class="ts">提交 CR 对象（yaml）</text>

  <!-- CRD 对象 -->
  <rect x="50" y="160" width="260" height="120" rx="10" class="node-brand"/>
  <text x="180" y="184" class="t">CRD 自定义资源（如 CronHPA）</text>
  <text x="76" y="212" class="tsl">spec（期望状态）：</text>
  <text x="96" y="230" class="tsl">crontab / workloadName / replicas: 3</text>
  <text x="76" y="256" class="tsl">status（实际状态）：</text>
  <text x="96" y="274" class="tsl">readyReplicas: 2（由 Operator 回写）</text>

  <!-- 控制循环 -->
  <rect x="400" y="120" width="270" height="200" rx="12" class="boundary"/>
  <text x="535" y="100" class="t">Operator 控制循环（Controller）</text>

  <rect x="440" y="140" width="190" height="40" rx="8" class="node-neutral"/>
  <text x="535" y="157" class="t">Observe 观察</text>
  <text x="535" y="173" class="ts">Watch CR / 资源实际状态</text>

  <rect x="440" y="200" width="190" height="40" rx="8" class="node-neutral"/>
  <text x="535" y="217" class="t">Analyze 分析</text>
  <text x="535" y="233" class="ts">计算 Spec 与实际的 Diff</text>

  <rect x="440" y="260" width="190" height="40" rx="8" class="node-neutral"/>
  <text x="535" y="277" class="t">Act 执行</text>
  <text x="535" y="293" class="ts">创建/更新 Deployment 等</text>

  <path d="M 535 180 L 535 200" class="flow" marker-end="url(#arrB)"/>
  <path d="M 535 240 L 535 260" class="flow" marker-end="url(#arrB)"/>
  <!-- 循环回流：Act → Observe -->
  <path d="M 630 300 C 690 330 690 120 640 140" class="flow" marker-end="url(#arrB)"/>
  <text x="668" y="225" class="ts" transform="rotate(90 668 225)">循环往复</text>

  <!-- K8s API Server / 原生资源 -->
  <rect x="400" y="360" width="270" height="50" rx="10" class="node-external"/>
  <text x="535" y="381" class="t">K8s API Server（etcd）</text>
  <text x="535" y="399" class="ts">Deployment / ConfigMap / Service ...</text>

  <!-- 连线 -->
  <path d="M 150 106 L 150 160" class="flow" marker-end="url(#arrB)"/>
  <path d="M 310 200 C 360 200 380 180 440 165" class="read" marker-end="url(#arrM)"/>
  <text x="352" y="190" class="ts">Watch</text>
  <path d="M 440 285 C 380 310 370 380 400 380" class="read" marker-end="url(#arrM)"/>
  <text x="368" y="330" class="ts">增删改</text>
  <path d="M 535 360 L 535 340" class="read" marker-end="url(#arrM)"/>
  <text x="570" y="352" class="tsl">读实际状态</text>
</svg>
