<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-label="Kubebuilder 架构：Manager 统一管理 Controller、Cache、Client 与 Webhook，对接 API Server">
  <style>
    .t { fill: #171717; font: 500 14px/20px -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; text-anchor: middle; }
    .ts { fill: #52525B; font: 400 12px/18px -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; text-anchor: middle; }
    .tsl { fill: #52525B; font: 400 12px/18px -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; text-anchor: start; }
    .flow { stroke: #0FDC78; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .read { stroke: #52525B; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 4 4; fill: none; }
    .boundary { fill: none; stroke: rgba(23, 23, 23, 0.12); stroke-dasharray: 6 6; }
    .node-neutral { fill: #FFFFFF; stroke: rgba(23, 23, 23, 0.16); }
    .node-external { fill: #EFEFF2; stroke: rgba(23, 23, 23, 0.16); }
    .node-brand { fill: #E5FFF2; stroke: #0FDC78; }
    .capsule { fill: #FFFFFF; stroke: rgba(23, 23, 23, 0.16); }
  </style>
  <defs>
    <marker id="arrB2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#0FDC78"/>
    </marker>
    <marker id="arrM2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#52525B"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="540" rx="16" fill="#F7F7F8"/>

  <text x="380" y="36" class="t" style="font-size:16px">Kubebuilder（controller-runtime）架构</text>

  <!-- Manager 边界 -->
  <rect x="40" y="60" width="560" height="440" rx="12" class="boundary"/>
  <text x="62" y="86" class="tsl" style="font-weight:600">Manager（每个集群一个实例，HA 可多个）</text>
  <text x="62" y="106" class="tsl">leader 选举 · metrics 暴露 · webhook 证书 · 事件广播</text>

  <!-- Controller -->
  <rect x="70" y="130" width="300" height="200" rx="10" class="node-brand"/>
  <text x="220" y="154" class="t">Controller（每个 Kind 一个）</text>
  <rect x="90" y="170" width="120" height="34" rx="8" class="node-neutral"/>
  <text x="150" y="192" class="ts">工作队列</text>
  <rect x="230" y="170" width="120" height="34" rx="8" class="node-neutral"/>
  <text x="290" y="192" class="ts">失败重试</text>
  <rect x="90" y="220" width="260" height="44" rx="8" class="node-neutral"/>
  <text x="220" y="238" class="t">Reconciler（业务逻辑，开发者实现）</text>
  <text x="220" y="256" class="ts">Reconcile(req)：Diff → Act</text>
  <text x="220" y="292" class="ts">还具备 Cache 能力</text>

  <!-- Cache -->
  <rect x="70" y="360" width="260" height="60" rx="10" class="node-neutral"/>
  <text x="200" y="384" class="t">Cache（Informer 池）</text>
  <text x="200" y="404" class="ts">缓存 GET 过的对象，读多写少时降负载</text>

  <!-- Client -->
  <rect x="70" y="440" width="260" height="44" rx="10" class="node-neutral"/>
  <text x="200" y="458" class="t">Client</text>
  <text x="200" y="476" class="ts">读走缓存，写直达 API Server</text>

  <!-- Webhook -->
  <rect x="380" y="360" width="190" height="124" rx="10" class="node-neutral"/>
  <text x="475" y="384" class="t">Webhook</text>
  <text x="475" y="406" class="ts">Defaulter：补默认值</text>
  <text x="475" y="426" class="ts">Validator：拒绝非法对象</text>
  <text x="475" y="446" class="ts">（Admission 准入控制）</text>
  <text x="475" y="466" class="ts">一般不直接用</text>

  <path d="M 220 220 L 220 220" class="flow"/>

  <!-- API Server -->
  <rect x="630" y="200" width="100" height="120" rx="10" class="node-external"/>
  <text x="680" y="230" class="t">API</text>
  <text x="680" y="250" class="t">Server</text>
  <text x="680" y="274" class="ts">etcd</text>

  <!-- Manager ↔ API Server -->
  <path d="M 600 260 L 630 260" class="flow" marker-end="url(#arrB2)"/>
  <path d="M 630 280 L 600 280" class="read" marker-end="url(#arrM2)"/>
  <text x="615" y="246" class="ts">写</text>
  <text x="615" y="300" class="ts">读</text>
  <!-- Cache 到 Controller -->
  <path d="M 200 360 L 200 330" class="flow" marker-end="url(#arrB2)"/>
  <text x="236" y="348" class="tsl">注入事件</text>
  <!-- Client 到 API Server 的提示 -->
  <path d="M 330 452 C 560 452 640 380 672 320" class="read" marker-end="url(#arrM2)"/>
</svg>
