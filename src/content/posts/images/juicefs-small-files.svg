<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" role="img" aria-label="大文件与小文件在对象存储中的排布对比">
  <defs>
    <pattern id="tiny" width="17" height="17" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="9" height="9" rx="1.5" fill="#FEE2E2" stroke="#F87171" stroke-width="0.8"/>
    </pattern>
    <marker id="f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="359" rx="14" fill="#FBFCFE" stroke="#E5EAF2"/>

  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">

    <text x="44" y="52" font-size="13" font-weight="600" fill="#0F172A">1 GiB 大文件</text>
    <rect x="44" y="70" width="380" height="44" rx="8" fill="#DCFCE7" stroke="#86EFAC"/>
    <text x="234" y="98" font-size="12" fill="#15803D" text-anchor="middle">backup.tar · 1 GiB</text>
    <line x1="234" y1="122" x2="234" y2="148" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#f1)"/>

    <g fill="#DCFCE7" stroke="#86EFAC">
      <rect x="44" y="154" width="26" height="44" rx="3"/><rect x="86" y="154" width="26" height="44" rx="3"/>
      <rect x="128" y="154" width="26" height="44" rx="3"/><rect x="170" y="154" width="26" height="44" rx="3"/>
      <rect x="212" y="154" width="26" height="44" rx="3"/><rect x="254" y="154" width="26" height="44" rx="3"/>
      <rect x="296" y="154" width="26" height="44" rx="3"/><rect x="338" y="154" width="26" height="44" rx="3"/>
    </g>
    <text x="380" y="184" font-size="16" fill="#94A3B8">…</text>
    <text x="44" y="224" font-size="12" fill="#64748B">256 个对象 · 每个 4 MiB</text>

    <text x="470" y="52" font-size="13" font-weight="600" fill="#0F172A">同样 1 GiB，由 10 KiB 小文件组成</text>
    <rect x="470" y="70" width="384" height="128" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="471" y="71" width="382" height="126" fill="url(#tiny)"/>
    <text x="470" y="224" font-size="12" fill="#64748B">约 105,000 个对象 · 每个 10 KiB</text>

    <line x1="446" y1="52" x2="446" y2="240" stroke="#E2E8F0"/>

    <rect x="44" y="262" width="812" height="56" rx="10" fill="#FFF7ED" stroke="#FED7AA"/>
    <text x="450" y="288" font-size="12" fill="#C2410C" text-anchor="middle">同样的数据量，对象数差约 400 倍</text>
    <text x="450" y="306" font-size="11" fill="#EA580C" text-anchor="middle">对象按个数计费、按请求计费 —— 小文件是成本问题，不只是性能问题</text>
  </g>
</svg>
