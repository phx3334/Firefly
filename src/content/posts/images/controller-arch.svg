<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-label="Controller 处理链与四种重试结果：Source 入队，ProcessNextWorkItem 取出，ReconcileHandler 调用 Reconcile，按返回值决定删除或重试">
  <style>
    .t { fill: #171717; font: 500 14px/20px -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; text-anchor: middle; }
    .ts { fill: #52525B; font: 400 12px/18px -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; text-anchor: middle; }
    .tsl { fill: #52525B; font: 400 12px/18px -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; text-anchor: start; }
    .flow { stroke: #0FDC78; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .read { stroke: #52525B; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 4 4; fill: none; }
    .boundary { fill: none; stroke: rgba(23, 23, 23, 0.12); stroke-dasharray: 6 6; }
    .node-neutral { fill: #FFFFFF; stroke: rgba(23, 23, 23, 0.16); }
    .node-external { fill: #EFEFF2; stroke: rgba(23, 23, 23, 0.16); }
    .node-brand { fill: #E5FFF2; stroke: #0FDC78; }
    .capsule { fill: #FFFFFF; stroke: rgba(23, 23, 23, 0.16); }
  </style>
  <defs>
    <marker id="arrB4" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#0FDC78"/>
    </marker>
    <marker id="arrM4" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#52525B"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="460" rx="16" fill="#F7F7F8"/>

  <!-- 处理链 -->
  <text x="220" y="40" class="t" style="font-size:15px">Controller 处理链</text>

  <rect x="50" y="60" width="160" height="60" rx="10" class="node-neutral"/>
  <text x="130" y="84" class="t">Source</text>
  <text x="130" y="104" class="ts">Informer 监听变化</text>

  <rect x="270" y="60" width="150" height="60" rx="10" class="node-brand"/>
  <text x="345" y="84" class="t">工作队列</text>
  <text x="345" y="104" class="ts">RateLimitQueue</text>

  <rect x="480" y="60" width="230" height="60" rx="10" class="node-neutral"/>
  <text x="595" y="84" class="t">ProcessNextWorkItem()</text>
  <text x="595" y="104" class="ts">循环取元素</text>

  <rect x="480" y="170" width="230" height="60" rx="10" class="node-neutral"/>
  <text x="595" y="194" class="t">ReconcileHandler()</text>
  <text x="595" y="214" class="ts">调用 Reconcile</text>

  <rect x="480" y="280" width="230" height="60" rx="10" class="node-brand"/>
  <text x="595" y="304" class="t">Reconcile()</text>
  <text x="595" y="324" class="ts">业务逻辑（幂等）</text>

  <path d="M 210 90 L 270 90" class="flow" marker-end="url(#arrB4)"/>
  <text x="240" y="82" class="ts">入队</text>
  <path d="M 420 90 L 480 90" class="flow" marker-end="url(#arrB4)"/>
  <text x="450" y="82" class="ts">取出</text>
  <path d="M 595 120 L 595 170" class="flow" marker-end="url(#arrB4)"/>
  <path d="M 595 230 L 595 280" class="flow" marker-end="url(#arrB4)"/>

  <!-- 四种结果 -->
  <text x="220" y="180" class="t" style="font-size:15px">Reconcile 返回值 → 四种结果</text>

  <rect x="50" y="200" width="280" height="46" rx="8" class="node-neutral"/>
  <text x="66" y="220" class="tsl">① return ctrl.Result{}, nil</text>
  <text x="66" y="238" class="tsl">成功 → 元素从队列删除，不再重试</text>

  <rect x="50" y="254" width="280" height="46" rx="8" class="node-neutral"/>
  <text x="66" y="274" class="tsl">② return ctrl.Result{}, err</text>
  <text x="66" y="292" class="tsl">失败 → err 自动触发重新入队（限速）</text>

  <rect x="50" y="308" width="280" height="46" rx="8" class="node-neutral"/>
  <text x="66" y="328" class="tsl">③ return ctrl.Result{Requeue: true}, nil</text>
  <text x="66" y="346" class="tsl">成功但仍需重试 → 可跟踪重试次数</text>

  <rect x="50" y="362" width="280" height="46" rx="8" class="node-neutral"/>
  <text x="66" y="382" class="tsl">④ RequeueAfter: 5*time.Second</text>
  <text x="66" y="400" class="tsl">延迟重试 → 天然实现定时任务</text>

  <path d="M 480 310 C 400 310 380 220 330 220" class="read" marker-end="url(#arrM4)"/>
  <text x="392" y="300" class="ts">按返回值分流</text>
  <path d="M 330 277 C 420 277 420 250 480 210" class="read" marker-end="url(#arrM4)"/>
  <text x="330" y="430" class="ts">重试的元素重新走一遍处理链，直到 ① 出现为止</text>
</svg>
