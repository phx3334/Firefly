    <line x1="618" y1="404" x2="636" y2="404" stroke="#98a2b3" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
    <text x="750" y="409" font-size="14" fill="#999">···</text>

    <rect x="24" y="486" width="752" height="158" rx="8" fill="#f7f9fc" stroke="#d8dee8"/>
    <text x="40" y="512" font-size="13" fill="#333"><tspan fill="#ff7a45" font-weight="bold">① 访问根节点：</tspan>拿 55 和根里的键逐个比较，40 &lt; 55 ≤ 70，落在中间区间，沿 P2 指针下探</text>
    <text x="40" y="536" font-size="13" fill="#333"><tspan fill="#ff7a45" font-weight="bold">② 访问中间节点：</tspan>同样比较，55 ≤ 55，沿左指针下探到叶子层；<tspan fill="#ff7a45" font-weight="bold">③ 叶子层命中：</tspan>找到主键 55 的整行数据，读取返回</text>
    <text x="40" y="562" font-size="13" fill="#333"><tspan font-weight="bold">图中元素：</tspan>数字是键（路由判断依据）；P 是指针（通向下一层节点）；绿色格子是数据（只在叶子层，按主键有序、双向链表串联）</text>
    <text x="40" y="586" font-size="13" fill="#333"><tspan font-weight="bold">为什么快：</tspan>索引节点不存数据 → 单页塞得下上千“键+指针” → 三层路由两千万行，点查最多 3 次页 IO</text>
    <text x="40" y="610" font-size="13" fill="#333"><tspan font-weight="bold">锦上添花：</tspan>根和中间节点常驻内存，实际通常只落盘叶子一次；范围查询定位下界后沿链表向右扫到上界，不回树</text>
  </g>
</svg>