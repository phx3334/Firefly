    <text x="624" y="241" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4e89">85</text>
    <text x="668" y="239" text-anchor="middle" font-size="12" font-style="italic" fill="#8a93a6">P</text>

    <rect x="30" y="360" width="96" height="88" rx="5" fill="#eef8ee" stroke="#4a8a5c" stroke-width="1.6"/>
