  <rect width="800" height="660" fill="#ffffff"/>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="400" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">InnoDB 聚簇索引（B+ 树）：键、指针、数据的组织与查询路径</text>

    <circle cx="260" cy="98" r="12" fill="#ff7a45" stroke="#fff" stroke-width="2"/>
    <text x="260" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">①</text>
    <text x="530" y="103" font-size="14" font-weight="bold" fill="#ff7a45">40 &lt; 55 ≤ 70 → 走 P2</text>
    <text x="20" y="172" font-size="12" fill="#8a93a6">①②③ 为查询 id = 55 的访问顺序</text>

    <path d="M312,126 C312,170 176,164 176,208" fill="none" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#ah)"/>
    <path d="M400,126 L400,208" fill="none" stroke="#ff7a45" stroke-width="2" marker-end="url(#ahO)"/>
    <circle cx="400" cy="190" r="12" fill="#ff7a45" stroke="#fff" stroke-width="2"/>
    <text x="400" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">②</text>
    <text x="420" y="195" font-size="14" font-weight="bold" fill="#ff7a45">55 ≤ 55 → 走左指针</text>
    <path d="M488,126 C488,170 624,164 624,208" fill="none" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#ah)"/>

