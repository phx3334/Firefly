    <text x="648" y="430" font-size="13" font-weight="bold" fill="#1a6b33">95</text>
    <text x="688" y="430" font-size="13" fill="#33502c">陈四</text>

    <line x1="130" y1="404" x2="148" y2="404" stroke="#98a2b3" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
    <line x1="252" y1="404" x2="270" y2="404" stroke="#98a2b3" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
