    <line x1="274" y1="404" x2="370" y2="404" stroke="#9dbfa6"/>
    <line x1="314" y1="360" x2="314" y2="448" stroke="#9dbfa6"/>
    <text x="282" y="386" font-size="13" font-weight="bold" fill="#1a6b33">45</text>
    <text x="322" y="386" font-size="13" fill="#33502c">钱七</text>
    <text x="282" y="430" font-size="13" font-weight="bold" fill="#b3541e">55</text>
    <text x="322" y="430" font-size="13" fill="#7a4218">孙八</text>
    <circle cx="383" cy="452" r="12" fill="#ff7a45" stroke="#fff" stroke-width="2"/>
    <text x="383" y="457" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">③</text>

    <rect x="396" y="360" width="96" height="88" rx="5" fill="#eef8ee" stroke="#4a8a5c" stroke-width="1.6"/>
    <line x1="396" y1="404" x2="492" y2="404" stroke="#9dbfa6"/>
    <line x1="436" y1="360" x2="436" y2="448" stroke="#9dbfa6"/>
    <text x="404" y="386" font-size="13" font-weight="bold" fill="#1a6b33">60</text>
    <text x="444" y="386" font-size="13" fill="#33502c">周九</text>
    <text x="404" y="430" font-size="13" font-weight="bold" fill="#1a6b33">65</text>
    <text x="444" y="430" font-size="13" fill="#33502c">吴十</text>

    <rect x="518" y="360" width="96" height="88" rx="5" fill="#eef8ee" stroke="#4a8a5c" stroke-width="1.6"/>
    <line x1="518" y1="404" x2="614" y2="404" stroke="#9dbfa6"/>
