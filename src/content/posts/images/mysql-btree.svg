<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660" width="800" height="660" role="img" aria-label="InnoDB 聚簇索引 B+ 树结构：索引节点只存键和指针，整行数据按主键有序存放在叶子层，叶子节点双向链表串联；①②③ 标注查询 id=55 的三步路径">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#98a2b3"/></marker>
