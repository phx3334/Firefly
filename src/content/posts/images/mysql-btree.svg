    <text x="78" y="386" font-size="13" fill="#33502c">张三</text>
    <text x="38" y="430" font-size="13" font-weight="bold" fill="#1a6b33">20</text>
    <text x="78" y="430" font-size="13" fill="#33502c">李四</text>

    <rect x="152" y="360" width="96" height="88" rx="5" fill="#eef8ee" stroke="#4a8a5c" stroke-width="1.6"/>
