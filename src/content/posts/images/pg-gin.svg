<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-label="GIN 倒排索引：三个文档分词得到词元，每个词元维护一份 ctid 列表构成倒排表，查询时对词元的列表取交集定位文档">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#98a2b3"/></marker>
  </defs>
  <rect width="800" height="560" fill="#ffffff"/>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="400" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">GIN 倒排索引：文档 → 词元 → 倒排表，查询 = 词元列表取交集</text>

    <!-- 文档层 -->
    <rect x="24" y="70" width="190" height="92" rx="6" fill="#eef8ee" stroke="#4a8a5c" stroke-width="1.6"/>
    <text x="36" y="96" font-size="13" font-weight="bold" fill="#1a6b33">文档 A · ctid 0,1</text>
    <text x="36" y="118" font-size="12" fill="#33502c">PG 云原生数据库</text>

    <rect x="24" y="182" width="190" height="92" rx="6" fill="#eef8ee" stroke="#4a8a5c" stroke-width="1.6"/>
    <text x="36" y="208" font-size="13" font-weight="bold" fill="#1a6b33">文档 B · ctid 0,7</text>
    <text x="36" y="230" font-size="12" fill="#33502c">PG 运维实战</text>

    <rect x="24" y="294" width="190" height="92" rx="6" fill="#eef8ee" stroke="#4a8a5c" stroke-width="1.6"/>
    <text x="36" y="320" font-size="13" font-weight="bold" fill="#1a6b33">文档 C · ctid 1,3</text>
    <text x="36" y="342" font-size="12" fill="#33502c">数据库索引原理</text>

    <!-- 分词箭头 -->
    <text x="245" y="58" font-size="12" fill="#8a93a6">分词（token 化）</text>
    <path d="M214,116 C246,116 250,98 276,98" fill="none" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#ah)"/>
    <path d="M214,116 C246,116 250,206 276,208" fill="none" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#ah)"/>
    <path d="M214,228 C246,228 250,102 276,100" fill="none" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#ah)"/>
    <path d="M214,228 C246,228 250,154 276,154" fill="none" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#ah)"/>
    <path d="M214,228 C244,228 250,266 276,266" fill="none" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#ah)"/>
    <path d="M214,340 C246,340 250,214 276,212" fill="none" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#ah)"/>
    <path d="M214,340 C244,340 250,322 276,322" fill="none" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#ah)"/>

    <!-- 词元层 -->
    <rect x="280" y="80" width="110" height="36" rx="18" fill="#ffe3cf" stroke="#ff7a45" stroke-width="1.8"/>
    <text x="335" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="#b3541e">PG</text>
    <rect x="280" y="136" width="110" height="36" rx="18" fill="#d7e6fb" stroke="#4a6fa5" stroke-width="1.6"/>
    <text x="335" y="159" text-anchor="middle" font-size="13" fill="#1d4e89">云原生</text>
    <rect x="280" y="192" width="110" height="36" rx="18" fill="#ffe3cf" stroke="#ff7a45" stroke-width="1.8"/>
    <text x="335" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#b3541e">数据库</text>
    <rect x="280" y="248" width="110" height="36" rx="18" fill="#d7e6fb" stroke="#4a6fa5" stroke-width="1.6"/>
    <text x="335" y="271" text-anchor="middle" font-size="13" fill="#1d4e89">运维</text>
    <rect x="280" y="304" width="110" height="36" rx="18" fill="#d7e6fb" stroke="#4a6fa5" stroke-width="1.6"/>
    <text x="335" y="327" text-anchor="middle" font-size="13" fill="#1d4e89">索引</text>

    <!-- 建倒排箭头 -->
    <text x="424" y="58" font-size="12" fill="#8a93a6">建倒排</text>
    <path d="M390,98 C424,98 434,120 466,120" fill="none" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#ah)"/>
    <path d="M390,154 C426,154 434,164 466,164" fill="none" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#ah)"/>
    <path d="M390,210 C424,210 434,208 466,208" fill="none" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#ah)"/>
    <path d="M390,266 C426,266 434,252 466,252" fill="none" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#ah)"/>
    <path d="M390,322 C426,322 434,296 466,296" fill="none" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#ah)"/>

    <!-- 倒排表 -->
    <text x="470" y="54" font-size="13" font-weight="bold" fill="#1d4e89">GIN 倒排表</text>
    <rect x="470" y="64" width="290" height="34" fill="#d7e6fb"/>
    <text x="535" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4e89">词元</text>
    <text x="680" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4e89">ctid 列表（倒排）</text>
    <rect x="470" y="98" width="290" height="44" fill="#ffe3cf"/>
    <rect x="470" y="142" width="290" height="44" fill="#fbfcfe"/>
    <rect x="470" y="186" width="290" height="44" fill="#ffe3cf"/>
    <rect x="470" y="230" width="290" height="44" fill="#fbfcfe"/>
    <rect x="470" y="274" width="290" height="44" fill="#fbfcfe"/>
    <rect x="470" y="64" width="290" height="254" fill="none" stroke="#4a6fa5" stroke-width="1.6"/>
    <line x1="470" y1="98" x2="760" y2="98" stroke="#9dbfa6"/>
    <line x1="470" y1="142" x2="760" y2="142" stroke="#d8dee8"/>
    <line x1="470" y1="186" x2="760" y2="186" stroke="#d8dee8"/>
    <line x1="470" y1="230" x2="760" y2="230" stroke="#d8dee8"/>
    <line x1="470" y1="274" x2="760" y2="274" stroke="#d8dee8"/>
    <line x1="600" y1="64" x2="600" y2="318" stroke="#9dbfa6"/>
    <text x="535" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#b3541e">PG</text>
    <text x="680" y="125" text-anchor="middle" font-size="12.5" fill="#7a4218">0,1 · 0,7</text>
    <text x="535" y="169" text-anchor="middle" font-size="13" fill="#1d4e89">云原生</text>
    <text x="680" y="169" text-anchor="middle" font-size="12.5" fill="#444">0,1</text>
    <text x="535" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#b3541e">数据库</text>
    <text x="680" y="213" text-anchor="middle" font-size="12.5" fill="#7a4218">0,1 · 1,3</text>
    <text x="535" y="257" text-anchor="middle" font-size="13" fill="#1d4e89">运维</text>
    <text x="680" y="257" text-anchor="middle" font-size="12.5" fill="#444">0,7</text>
    <text x="535" y="301" text-anchor="middle" font-size="13" fill="#1d4e89">索引</text>
    <text x="680" y="301" text-anchor="middle" font-size="12.5" fill="#444">1,3</text>

    <!-- 查询示例 -->
    <rect x="24" y="396" width="752" height="140" rx="8" fill="#f7f9fc" stroke="#ff7a45" stroke-width="1.8"/>
    <text x="40" y="424" font-size="13" fill="#333"><tspan fill="#ff7a45" font-weight="bold">查询示例：</tspan>查“数据库 AND PG”——两个词元的 ctid 列表取交集</text>
    <text x="40" y="450" font-size="13" fill="#333">{0,1 · 1,3} ∩ {0,1 · 0,7} = {0,1} → 只剩文档 A，回堆表取整行</text>
    <text x="40" y="476" font-size="13" fill="#333"><tspan font-weight="bold">JSONB 同理：</tspan>把键值对拆成词元建倒排，百万级文档也能毫秒级查询</text>
    <text x="40" y="502" font-size="13" fill="#333"><tspan font-weight="bold">代价：</tspan>每个词元独立维护一份列表，文本越大索引越大；分词器决定索引质量</text>
  </g>
</svg>
