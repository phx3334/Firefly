<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img" aria-label="Redis 单实例全景：客户端经 epoll 多路复用汇入单线程事件循环，命令在内存里原地执行，写路径顺带记 aof_buf 与复制缓冲推给从库，bgsave 用 fork 子进程做快照落盘 RDB 与 AOF，单线程纪律是禁 O(N) 大命令">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#98a2b3"/></marker>
    <marker id="ahO" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff7a45"/></marker>
  </defs>
  <rect width="800" height="640" fill="#ffffff"/>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="400" y="32" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#222">Redis 单实例全景：一个单线程事件循环管一切，持久化与复制都是它的下游</text>

    <!-- 客户端 -->
    <rect x="40" y="84" width="150" height="34" rx="6" fill="#fbfcfe" stroke="#4a6fa5" stroke-width="1.4"/>
    <text x="52" y="106" font-size="12" fill="#1d4e89">客户端（连接池）</text>
    <rect x="40" y="128" width="150" height="34" rx="6" fill="#fbfcfe" stroke="#4a6fa5" stroke-width="1.4"/>
    <text x="52" y="150" font-size="12" fill="#1d4e89">客户端（连接池）</text>
    <rect x="40" y="172" width="150" height="34" rx="6" fill="#fbfcfe" stroke="#4a6fa5" stroke-width="1.4"/>
    <text x="52" y="194" font-size="12" fill="#1d4e89">客户端（连接池）</text>
    <path d="M190,101 C225,101 225,246 258,246" fill="none" stroke="#98a2b3" stroke-width="1.5" marker-end="url(#ah)"/>
    <path d="M190,145 C220,145 220,252 258,252" fill="none" stroke="#98a2b3" stroke-width="1.5" marker-end="url(#ah)"/>
    <path d="M190,189 C225,189 225,258 258,258" fill="none" stroke="#98a2b3" stroke-width="1.5" marker-end="url(#ah)"/>

    <!-- epoll -->
    <rect x="40" y="230" width="190" height="58" rx="8" fill="#f7f9fc" stroke="#4a6fa5" stroke-width="1.6"/>
    <text x="52" y="252" font-size="12.5" font-weight="bold" fill="#1d4e89">epoll 多路复用</text>
    <text x="52" y="272" font-size="11" fill="#5a6478">一个线程监听几千个连接</text>
    <path d="M230,259 L262,259 L262,200 L266,200" fill="none" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#ah)"/>

    <!-- 事件循环 -->
    <rect x="270" y="80" width="280" height="210" rx="8" fill="#fbfcfe" stroke="#4a6fa5" stroke-width="2.2"/>
    <text x="284" y="108" font-size="13.5" font-weight="bold" fill="#1d4e89">事件循环 · 单线程执行</text>
    <text x="284" y="140" font-size="12" fill="#333">① 取就绪连接上的命令</text>
    <text x="284" y="168" font-size="12" fill="#333">② 执行：纯内存计算，微秒级</text>
    <text x="284" y="196" font-size="12" fill="#333">③ 写回包，接着处理下一个</text>
    <text x="284" y="240" font-size="11.5" fill="#b3541e">没有锁竞争、没有上下文切换</text>

    <!-- 内存 -->
    <path d="M410,290 L410,324" fill="none" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#ah)"/>
    <rect x="270" y="326" width="280" height="80" rx="8" fill="#eef8ee" stroke="#4a8a5c" stroke-width="1.8"/>
    <text x="284" y="352" font-size="12.5" font-weight="bold" fill="#1a6b33">内存：dict 等数据结构</text>
    <text x="284" y="372" font-size="11.5" fill="#33502c">读写原地完成，zset 用跳表等实现</text>
    <text x="284" y="392" font-size="11" fill="#7fa184">过期删除＋内存淘汰策略负责水位</text>

    <!-- 右侧：aof_buf -->
    <path d="M550,120 L612,120" fill="none" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#ah)"/>
    <rect x="614" y="88" width="156" height="64" rx="8" fill="#f7f9fc" stroke="#d8dee8"/>
    <text x="626" y="112" font-size="12.5" font-weight="bold" fill="#1d4e89">aof_buf 写缓冲</text>
    <text x="626" y="132" font-size="11" fill="#5a6478">攒批后按策略落盘</text>

    <!-- 右侧：复制缓冲 -->
    <path d="M550,190 L612,190" fill="none" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#ah)"/>
    <rect x="614" y="164" width="156" height="64" rx="8" fill="#f7f9fc" stroke="#d8dee8"/>
    <text x="626" y="188" font-size="12.5" font-weight="bold" fill="#1d4e89">复制缓冲</text>
    <text x="626" y="208" font-size="11" fill="#5a6478">写命令流 → 从库</text>

    <!-- 右侧：fork -->
    <rect x="614" y="258" width="156" height="88" rx="8" fill="#fdf3ec" stroke="#e8815a" stroke-width="1.6"/>
    <text x="626" y="282" font-size="12.5" font-weight="bold" fill="#b3541e">bgsave / AOF 重写</text>
    <text x="626" y="302" font-size="11" fill="#5a6478">fork 子进程，写时复制</text>
    <text x="626" y="320" font-size="11" fill="#5a6478">主进程继续服务不阻塞</text>

    <!-- 磁盘 -->
    <path d="M410,406 L410,438" fill="none" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#ah)"/>
    <path d="M692,346 C700,390 660,406 640,430" fill="none" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#ah)"/>
    <path d="M692,152 L716,152 L716,430 L640,430" fill="none" stroke="#98a2b3" stroke-width="1.4" stroke-dasharray="5 3"/>
    <rect x="270" y="440" width="500" height="66" rx="8" fill="#f7f9fc" stroke="#4a6fa5" stroke-width="1.6"/>
    <text x="284" y="464" font-size="12.5" font-weight="bold" fill="#1d4e89">磁盘</text>
    <text x="284" y="484" font-size="11.5" fill="#333">RDB 快照文件（fork 出的子进程写）　·　AOF 追加文件（混合持久化：RDB 基底＋增量段）</text>
    <text x="284" y="500" font-size="11" fill="#5a6478">崩溃恢复：加载 RDB 基底 → 重放其后增量</text>

    <!-- 底部面板 -->
    <rect x="30" y="532" width="740" height="84" rx="8" fill="#f7f9fc" stroke="#d8dee8"/>
    <text x="44" y="554" font-size="12.5" font-weight="bold" fill="#b3541e">单线程的纪律</text>
    <text x="44" y="574" font-size="11.5" fill="#333">任何 O(N) 大命令（KEYS、百万级集合全量读）都会占住唯一执行线程、卡住所有客户端——慢日志以微秒计、大 key 致命，根源都在这</text>
    <text x="44" y="598" font-size="11.5" fill="#333">数据的清理也走"不打扰主线程"路线：过期靠惰性＋定期抽样删除，内存满按淘汰策略腾地方，永远不出现全局暂停</text>
  </g>
</svg>
