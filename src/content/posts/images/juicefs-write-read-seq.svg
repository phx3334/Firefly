<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" width="100%" role="img" aria-label="JuiceFS 写入与读取时序">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1D4ED8"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#047857"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#047857"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="979" height="759" rx="14" fill="#FBFCFE" stroke="#E5EAF2"/>

  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#1E293B">

    <!-- 泳道头 -->
    <g text-anchor="middle" font-size="13">
      <rect x="45" y="18" width="110" height="32" rx="16" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text x="100" y="39">应用</text>
      <rect x="225" y="18" width="130" height="32" rx="16" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text x="290" y="39">内核 FUSE</text>
      <rect x="395" y="18" width="170" height="32" rx="16" fill="#F5F3FF" stroke="#DDD6FE"/>
      <text x="480" y="39" fill="#6D28D9">JuiceFS 客户端</text>
      <rect x="600" y="18" width="170" height="32" rx="16" fill="#EFF6FF" stroke="#BFDBFE"/>
      <text x="685" y="39" fill="#1D4ED8">元数据引擎</text>
      <rect x="795" y="18" width="150" height="32" rx="16" fill="#ECFDF5" stroke="#A7F3D0"/>
      <text x="870" y="39" fill="#047857">对象存储</text>
    </g>

    <!-- 生命线 -->
    <g stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 5">
      <line x1="100" y1="60" x2="100" y2="352"/>
      <line x1="290" y1="60" x2="290" y2="352"/>
      <line x1="480" y1="60" x2="480" y2="352"/>
      <line x1="685" y1="60" x2="685" y2="352"/>
      <line x1="870" y1="60" x2="870" y2="352"/>
      <line x1="100" y1="404" x2="100" y2="706"/>
      <line x1="290" y1="404" x2="290" y2="706"/>
      <line x1="480" y1="404" x2="480" y2="706"/>
      <line x1="685" y1="404" x2="685" y2="706"/>
      <line x1="870" y1="404" x2="870" y2="706"/>
    </g>

    <!-- 分区标题 -->
    <text x="26" y="96" font-size="14" font-weight="700" fill="#0F172A">写入</text>
    <text x="26" y="440" font-size="14" font-weight="700" fill="#0F172A">读取</text>
    <line x1="26" y1="376" x2="954" y2="376" stroke="#E5EAF2"/>

    <!-- 写路径 -->
    <g stroke-width="1.6" fill="none">
      <line x1="100" y1="118" x2="284" y2="118" stroke="#475569" marker-end="url(#a)"/>
      <line x1="290" y1="154" x2="474" y2="154" stroke="#475569" marker-end="url(#a)"/>
    </g>
    <g text-anchor="middle" font-size="12" fill="#334155" stroke="#FBFCFE" stroke-width="4" paint-order="stroke">
      <text x="192" y="110">write()</text>
      <text x="382" y="146">写入</text>
    </g>

    <rect x="412" y="172" width="136" height="32" rx="8" fill="#F5F3FF" stroke="#DDD6FE"/>
    <text x="480" y="193" text-anchor="middle" font-size="12" fill="#6D28D9">内存缓冲区</text>

    <g stroke-width="1.6" fill="none">
      <line x1="480" y1="252" x2="864" y2="252" stroke="#047857" marker-end="url(#ag)"/>
      <line x1="480" y1="294" x2="679" y2="294" stroke="#1D4ED8" marker-end="url(#ab)"/>
      <line x1="685" y1="328" x2="486" y2="328" stroke="#1D4ED8" stroke-dasharray="5 4" marker-end="url(#ab)"/>
    </g>
    <g text-anchor="middle" font-size="12" stroke="#FBFCFE" stroke-width="4" paint-order="stroke">
      <text x="672" y="244" fill="#047857">PUT Block ×N（异步）</text>
      <text x="582" y="286" fill="#1D4ED8">1 次元数据事务</text>
      <text x="582" y="320" fill="#1D4ED8">OK</text>
    </g>
    <text x="480" y="354" text-anchor="middle" font-size="11" fill="#94A3B8">↑ 应用早在第一行就拿到返回值了</text>

    <!-- 读路径 -->
    <g stroke-width="1.6" fill="none">
      <line x1="100" y1="446" x2="284" y2="446" stroke="#475569" marker-end="url(#a)"/>
      <line x1="290" y1="480" x2="474" y2="480" stroke="#475569" marker-end="url(#a)"/>
      <line x1="480" y1="516" x2="679" y2="516" stroke="#1D4ED8" marker-end="url(#ab)"/>
      <line x1="685" y1="550" x2="486" y2="550" stroke="#1D4ED8" stroke-dasharray="5 4" marker-end="url(#ab)"/>
      <line x1="480" y1="590" x2="864" y2="590" stroke="#047857" marker-end="url(#ag)"/>
      <line x1="870" y1="624" x2="486" y2="624" stroke="#047857" stroke-dasharray="5 4" marker-end="url(#ag)"/>
      <line x1="480" y1="660" x2="296" y2="660" stroke="#475569" marker-end="url(#a)"/>
      <line x1="290" y1="694" x2="106" y2="694" stroke="#475569" marker-end="url(#a)"/>
    </g>
    <g text-anchor="middle" font-size="12" stroke="#FBFCFE" stroke-width="4" paint-order="stroke">
      <text x="192" y="438" fill="#334155">read()</text>
      <text x="382" y="472" fill="#334155">读取</text>
      <text x="582" y="508" fill="#1D4ED8">① 查 Chunk → Slice → Block ID</text>
      <text x="582" y="542" fill="#1D4ED8">Block 列表</text>
      <text x="672" y="582" fill="#047857">② GET Block</text>
      <text x="672" y="616" fill="#047857">数据</text>
      <text x="388" y="652" fill="#334155">返回</text>
      <text x="198" y="686" fill="#334155">数据</text>
    </g>

    <rect x="746" y="686" width="200" height="30" rx="15" fill="#FFF7ED" stroke="#FED7AA"/>
    <text x="846" y="706" text-anchor="middle" font-size="12" fill="#C2410C">冷读至少 2 次网络往返</text>
  </g>
</svg>
