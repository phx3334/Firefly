<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" role="img" aria-label="JuiceFS CSI 挂载拓扑">
  <defs>
    <marker id="k1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <marker id="k2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1D4ED8"/>
    </marker>
    <marker id="k3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#047857"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="459" rx="14" fill="#FBFCFE" stroke="#E5EAF2"/>

  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">

    <rect x="28" y="52" width="572" height="368" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="7 5"/>
    <text x="46" y="76" font-size="12" fill="#64748B">Kubernetes 节点</text>

    <rect x="56" y="112" width="130" height="58" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="121" y="146" font-size="13" fill="#334155" text-anchor="middle">Pod A</text>

    <rect x="56" y="212" width="130" height="58" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="121" y="246" font-size="13" fill="#334155" text-anchor="middle">Pod B</text>

    <rect x="246" y="100" width="252" height="184" rx="10" fill="#F5F3FF" stroke="#DDD6FE"/>
    <text x="372" y="128" font-size="13" font-weight="600" fill="#6D28D9" text-anchor="middle">Mount Pod</text>
    <text x="372" y="150" font-size="11" fill="#7C3AED" text-anchor="middle">FUSE 挂载进程</text>
    <text x="372" y="170" font-size="11" fill="#7C3AED" text-anchor="middle">多 Pod 共享同一个</text>

    <g stroke="#475569" stroke-width="1.6" fill="none">
      <line x1="188" y1="141" x2="240" y2="141" marker-end="url(#k1)"/>
      <line x1="188" y1="241" x2="240" y2="241" marker-end="url(#k1)"/>
    </g>
    <text x="214" y="132" font-size="10" fill="#64748B" text-anchor="middle">mount</text>
    <text x="214" y="232" font-size="10" fill="#64748B" text-anchor="middle">mount</text>

    <rect x="246" y="330" width="252" height="58" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="372" y="356" font-size="13" font-weight="600" fill="#1D4ED8" text-anchor="middle">节点本地盘</text>
    <text x="372" y="375" font-size="11" fill="#2563EB" text-anchor="middle">--cache-dir</text>
    <line x1="372" y1="284" x2="372" y2="326" stroke="#475569" stroke-width="1.6" marker-end="url(#k1)"/>

    <rect x="668" y="106" width="200" height="72" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="768" y="136" font-size="13" font-weight="600" fill="#1D4ED8" text-anchor="middle">元数据引擎</text>
    <text x="768" y="157" font-size="11" fill="#2563EB" text-anchor="middle">Redis / MySQL / TiKV</text>

    <rect x="668" y="206" width="200" height="72" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="768" y="236" font-size="13" font-weight="600" fill="#047857" text-anchor="middle">对象存储</text>
    <text x="768" y="257" font-size="11" fill="#059669" text-anchor="middle">S3 / OSS / MinIO</text>

    <g stroke-width="1.6" fill="none">
      <line x1="502" y1="142" x2="662" y2="142" stroke="#1D4ED8" stroke-dasharray="5 4" marker-end="url(#k2)"/>
      <line x1="502" y1="242" x2="662" y2="242" stroke="#047857" marker-end="url(#k3)"/>
    </g>
    <text x="582" y="134" font-size="11" fill="#1D4ED8" text-anchor="middle">元数据</text>
    <text x="582" y="234" font-size="11" fill="#047857" text-anchor="middle">Block 读写</text>

    <text x="28" y="446" font-size="11" fill="#94A3B8">缓存落在节点本地盘：盘多大，缓存命中率就有多高</text>
  </g>
